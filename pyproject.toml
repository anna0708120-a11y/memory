[project]
name = "lin-soul-memory"
version = "0.1.0"
description = "Minimal authenticated MCP server for Lin Soul shared memory"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
